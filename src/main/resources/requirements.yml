# What a player needs inside their box to earn each advancement that grows the box.
# /boxadmin areas check <area> uses this to play out how a box grows in an area and to
# report where players get stuck and which advancements can never be earned there.
#
# This is a model, written by hand. It lists the raw resources an advancement comes down
# to, not every crafting step, and some entries are simplified. Correct it for your server.
#
# Each advancement has a list of needs, and all of them must be met. A need is one of:
#   block:<names>            a block in the box, e.g. block:iron_ore|deepslate_iron_ore
#   biome:<names>            a biome in the box
#   entity:<names>           a mob in the land or brought by a structure, see 'provides' below
#   structure:<names>        a structure from the area's structures file
#   nether-block:, nether-biome:, nether-entity:, nether-structure:
#                            the same in the nether. These only count once the nether is open.
#   after:<advancement>      another advancement earned first
#   size:<number>            a box of at least this size
#   never:<reason>           cannot be done in Boxed
#   set:<name>               every need in the named set under 'sets'
# Names can be separated by | to mean any of them, and can use * as a wildcard.
# Add *<number> to ask for that many, e.g. block:iron_ore|deepslate_iron_ore*3
# Put || between whole needs to mean either one will do.

# The advancement that has to be earned before anything in the nether counts
nether-advancement: minecraft:story/enter_the_nether

# Mobs that turn up in any box, however small
always:
  - zombie
  - skeleton
  - spider
  - creeper
  - enderman
  - witch
  - slime
  - phantom
  - bat
  - glow_squid
  - wandering_trader

# Things in the land that also count as something else. The mobs here are ones that spawn
# in a biome or come with a structure, which a survey of the land's blocks cannot see.
provides:
  - structure:village/*/villagers/* -> entity:villager
  - structure:village/*/zombie/villagers/* -> entity:zombie_villager
  - structure:village/common/iron_golem -> entity:iron_golem
  - structure:village/common/animals/cat_* -> entity:cat
  - structure:village/common/animals/horses_* -> entity:horse
  - structure:village/common/animals/cows_* -> entity:cow
  - structure:village/common/animals/pigs_* -> entity:pig
  - structure:village/common/animals/sheep_* -> entity:sheep
  - structure:village/desert/camel_spawn -> entity:camel
  - structure:boxed/frog -> entity:frog
  - structure:boxed/parrot -> entity:parrot
  - structure:boxed/axolotl -> entity:axolotl
  - structure:boxed/polar_bear -> entity:polar_bear
  - structure:boxed/pillager -> entity:pillager
  - structure:boxed/allay -> entity:allay
  - structure:boxed/bee -> entity:bee
  - structure:pillager_outpost/* -> entity:pillager
  - biome:swamp|mangrove_swamp -> entity:frog
  - biome:jungle|sparse_jungle|bamboo_jungle -> entity:parrot
  - biome:jungle|bamboo_jungle -> entity:ocelot
  - biome:jungle|bamboo_jungle -> entity:panda
  - biome:lush_caves -> entity:axolotl
  - biome:*ocean|river -> entity:drowned
  - biome:*ocean|river -> entity:cod
  - biome:warm_ocean|lukewarm_ocean|deep_lukewarm_ocean -> entity:pufferfish
  - biome:beach -> entity:turtle
  - biome:frozen_peaks|jagged_peaks|snowy_slopes -> entity:goat
  - biome:desert|snowy_plains|snowy_taiga|taiga|flower_forest|meadow|cherry_grove|grove -> entity:rabbit
  - biome:forest|taiga|snowy_taiga|old_growth_pine_taiga|old_growth_spruce_taiga|grove|dark_forest -> entity:wolf
  - biome:taiga|snowy_taiga|old_growth_pine_taiga|old_growth_spruce_taiga|grove -> entity:fox
  - biome:savanna|savanna_plateau|windswept_savanna|plains|sunflower_plains -> entity:horse
  - biome:plains|sunflower_plains|savanna|savanna_plateau|meadow -> entity:donkey
  - biome:savanna*|windswept_*|jagged_peaks|meadow|cherry_grove -> entity:llama
  - biome:savanna*|badlands|eroded_badlands|wooded_badlands -> entity:armadillo
  - biome:mushroom_fields -> entity:mooshroom
  - biome:snowy_plains|ice_spikes|frozen_ocean|deep_frozen_ocean -> entity:polar_bear
  - block:bee_nest|beehive -> entity:bee
  - block:short_grass|tall_grass -> entity:cow
  - block:short_grass|tall_grass -> entity:sheep
  - block:short_grass|tall_grass -> entity:pig
  - block:short_grass|tall_grass -> entity:chicken
  - nether-biome:nether_wastes|soul_sand_valley|basalt_deltas -> nether-entity:ghast
  - nether-biome:nether_wastes|crimson_forest -> nether-entity:piglin
  - nether-biome:crimson_forest -> nether-entity:hoglin
  - nether-biome:basalt_deltas -> nether-entity:magma_cube
  - nether-block:lava -> nether-entity:strider
  - nether-structure:fortress/* -> nether-entity:blaze
  - nether-structure:fortress/* -> nether-entity:wither_skeleton
  - nether-structure:bastion/* -> nether-entity:piglin

